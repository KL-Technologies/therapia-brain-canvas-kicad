# Generated by `python3 -m pcbharness.core.tools.scaffold_manifest`.
#
# Every value under `provenance:` was copied from the file named there, and the
# S0_manifest gate re-reads that file on every run and fails if the two disagree.
# Change the original, then re-run the scaffolder; do not edit the copy.
#
# Values NOT listed in `provenance:` are decisions recorded here and nowhere else.
#
# Product: Therapia EEG-HRV (Cerelog-derived), Rev.A_Y8, manufactured.
# No order_spec.json or mech_contract.json exists for this revision, so every
# value below with provenance comes from a script constant.

schema: therapia-pcb-harness/product/1
product:
  name: brain_canvas
  title: Therapia EEG-HRV (Cerelog-derived)
  revision: Rev.A_Y8
  repo: KL-Technologies/therapia-eeg-hrv-kicad
  board_file: board/Therapia_EEG-HRV.kicad_pcb
  status: "manufactured; no further revision planned. Kept as the second product in the Core equivalence proof and as a fixture (open_questions Q7, ruling E-1)."
host:
  kind: standalone
  note: No host module and therefore no M-Bus contract.
board:
  coordinate_system:
    origin: kicad_absolute
    y_axis: down
    note: Unlike m5stack this board has no contract coordinate system; it was imported from EasyEDA and the absolute KiCad grid is what every measurement refers to.
    # The drill/place origin the IPC-D-356 export was written from, in board mm.
    # This board exported from (120, 80), not KiCad's default; S8 measures every
    # d356 coordinate from it (escalation 007).
    drill_origin_mm: [120.0, 80.0]
  holes:
    copper_keepout_margin_mm: 0.2
    copper_margin_mm: 0.2
    npth:
      - [PEG2, 176.861075, -108.097861, 0.7]
      - [PEG1, 176.861075, -113.877885, 0.7]
      - [H1, 123.048, -83.048, 2.3876]
      - [H2, 176.9468, -83.048, 2.3876]
      - [H3, 123.048, -121.9608, 2.3876]
      - [H4, 176.9468, -121.9608, 2.3876]
  outline:
    h_mm: 45.0088
    tolerance_mm: 0.01
    w_mm: 61.8236
fab:
  vendor: jlcpcb
  layers: 4
  copper_layers:
    - F.Cu
    - In1.Cu
    - In2.Cu
    - B.Cu
  layer_roles:
    F.Cu: signal
    In1.Cu: ground
    In2.Cu: power
    B.Cu: signal
  via:
    in_pad_policy: forbidden
    covering: none
    minimum:
      annular_mm: 0.076
      diameter_mm: 0.45
      drill_mm: 0.3
    standard:
      diameter_mm: 0.6096
      drill_mm: 0.3048
  qty_pcb: 5
  qty_pcba: 2
  clearance:
    preferred_mm: 0.127
    standard_mm: 0.0889
  copper_extensions:
    - gtl
    - g1
    - g2
    - gbl
  edge_clearance_mm: 0.2
  gerber_extension_to_layer:
    gtl: F.Cu
    g1: In1.Cu
    g2: In2.Cu
    gbl: B.Cu
    gts: F.Mask
    gbs: B.Mask
    gtp: F.Paste
    gbp: B.Paste
    gto: F.SilkS
    gbo: B.SilkS
    gm1: Edge.Cuts
  hole_to_copper_mm: 0.2
  hole_to_hole_mm: 0.2
  mask:
    min_width_mm: 0.0508
    pad_to_mask_mm: 0.0508
  paste:
    pad_to_paste_mm: 0.0
  track:
    min_mm: 0.0889
    power_mm: 0.254
    signal_mm: 0.2032
packs:
  afe-adc:
    adc_ref: U_ADS
    adc_part: ADS1299
    zero_via_nets: []
    note: Rev.A predates the per-net copper rules; C1-C4 were never written for this board.
  esp32-straps:
    mcu_ref: U_MCU
    module: ESP32-WROOM-32UE
    body_mm:
      - 19.2
      - 18.0
    keepout_antenna_mm: 6.3
    strap_pins:
      IO12:
        pull: none
        why: MTDI pulled to 3V3 through 10k stops the module booting
  usb-uart:
    bridge_ref: U_USB
    bridge_part: CH340C
    lcsc: C7464026
    connector_ref: J1
    connector_kind: usb-c
  easyeda-import:
    source_export: import/
    importer_defects:
      - pad_net_loss
      - layer_name_mangling
  jlcpcb:
    cart: https://cart.jlcpcb.com/shopcart/cart
    # --- added 2026-09-05, escalation 025 (a) -------------------------
    # The six keys packs/jlcpcb's schema requires and this manifest did not
    # state. S0_manifest now validates every enabled pack against
    # packs/<name>/params.schema.json (open question Q12) and named the gap.
    # TRANSCRIBED, not decided. bom_csv / cpl_csv are the file names
    # scripts/61_make_bom_cpl.py writes (lines 162 and 187) and which are in
    # fab/. bom_columns / cpl_columns are that script's BOM_COLUMNS and
    # CPL_COLUMNS (lines 51 and 53). rules and rule_severities are
    # scripts/14_make_rules.py's own constants (CLEARANCE_MM, TRACK_MIN_MM,
    # ... and SEVERITY_ERROR / SEVERITY_WARNING / SEVERITY_IGNORE), which
    # that script writes into board/Therapia_EEG-HRV.kicad_pro. Not one
    # number here is new: ACCEPTANCE.md sections A and C remain the
    # authority and this is the machine-readable copy the packs read.
    bom_csv: BOM_JLCPCB.csv
    cpl_csv: CPL_JLCPCB.csv
    bom_columns:
      - Comment
      - Designator
      - Footprint
      - "LCSC Part #"
      - MPN
      - Manufacturer
      - Qty
    cpl_columns:
      - Designator
      - Mid X
      - Mid Y
      - Layer
      - Rotation
    rules:
      min_clearance_mm: 0.0889
      min_track_width_mm: 0.0889
      min_hole_to_hole_mm: 0.2
      min_hole_clearance_mm: 0.2
      min_copper_edge_clearance_mm: 0.2
      min_through_hole_diameter_mm: 0.3
      min_via_annular_width_mm: 0.076
      min_via_diameter_mm: 0.45
      track_track_preferred_mm: 0.127
      via_diameter_mm: 0.6096
      via_drill_mm: 0.3048
      track_signal_mm: 0.2032
      track_power_mm: 0.254
      pad_to_mask_mm: 0.0508
      pad_to_paste_mm: 0.0
      solder_mask_min_width_mm: 0.0508
    rule_severities:
      error:
        - annular_width
        - clearance
        - connection_width
        - copper_edge_clearance
        - creepage
        - diff_pair_gap_out_of_range
        - diff_pair_uncoupled_length_too_long
        - drill_out_of_range
        - footprint
        - footprint_symbol_mismatch
        - hole_clearance
        - hole_near_hole
        - hole_to_hole
        - invalid_outline
        - item_on_disabled_layer
        - items_not_allowed
        - length_out_of_range
        - malformed_courtyard
        - microvia_drill_out_of_range
        - padstack
        - shorting_items
        - skew_out_of_range
        - solder_mask_bridge
        - text_height
        - text_thickness
        - through_hole_pad_without_hole
        - too_many_vias
        - track_angle
        - track_segment_length
        - track_width
        - tracks_crossing
        - unconnected_items
        - unresolved_variable
        - zone_has_empty_net
        - zones_intersect
      warning:
        - courtyards_overlap
        - silk_overlap
        - silk_over_copper
        - silk_edge_clearance
        - starved_thermal
        - track_dangling
        - via_dangling
        - isolated_copper
        - copper_sliver
        - holes_co_located
        - footprint_type_mismatch
      ignore:
        - lib_footprint_issues
        - lib_footprint_mismatch
        - missing_courtyard
        - pth_inside_courtyard
        - npth_inside_courtyard
        - footprint_filters_mismatch
paths:
  contract: contract/netlist_contract.json
  contract_overrides: contract/contract_overrides.json
  parts_table: data/parts_lcsc.csv
  cpl_overrides: data/cpl_overrides.json
  body_overlap_allow: data/body_overlap_allow.json
  gates: gates
  fab_out: fab
  logs: logs
acceptance:
  document: ACCEPTANCE.md
  clauses:
    generic:
      - A
      - B
      - E
      - F
      - G
      - H
    product:
      - D
    from_pack:
      jlcpcb:
        - C
      easyeda-import: []
nets:
  plane_nets:
    - GND
    - AGND
    - DGND
    - 3V3
    - 5V
    - VNEG5
  routing_order:
    - analog_in
    - bypass
    - power
    - digital
    - other
  power_nets:
    - GND
    - CHASSIS_GND
    - AVDD
    - AVSS
    - DVDD
    - VDD_ESP
    - USB_5V
    - USB_VBUS_RAW
    - V5_LM_IN
    - V_3V3_IN
    - V_NLDO_IN
    - V_PLDO_IN
    - VNEG5
    - VREFP
    - VCAP1
    - VCAP2
    - VCAP3
    - VCAP4
    - LM_CAP_N
    - LM_CAP_P
tools:
  kicad: 10.0.5
  kicad_python_env:
    PYTHONNOUSERSITE: "1"
gates:
  S3_rules:
    known_defects:
      - [L1, mounting hole H4 through the AMS1117 GND pad, [hole_clearance], [NPTH pad of H4, of AMS1117]]
      - [L2, CHASSIS_GND bottom track through mounting hole H1, [hole_clearance], [NPTH pad of H1, "[CHASSIS_GND]"]]
      - [L3, ESP_TXD bottom track clipping mounting hole H4, [hole_clearance], [NPTH pad of H4, "[ESP_TXD]"]]
      - [L4a, USB_VBUS_RAW routing inside a USB-C peg hole, [hole_clearance], [NPTH pad of PEG, "[USB_VBUS_RAW]"]]
      - [L4b, a via drill overlapping a USB-C peg drill, [hole_to_hole], [NPTH pad of PEG, "Via [USB_VBUS_RAW]"]]
  S7_body:
    gap_mm: 0.15
provenance:
