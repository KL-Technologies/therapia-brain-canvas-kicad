# Generated by `python3 -m pcbharness.core.tools.scaffold_manifest`.
#
# Every value under `provenance:` was copied from the file named there, and the
# S0_manifest gate re-reads that file on every run and fails if the two disagree.
# Change the original, then re-run the scaffolder; do not edit the copy.
#
# Values NOT listed in `provenance:` are decisions recorded here and nowhere else.
#
# Product: Therapia EEG-HRV (Cerelog-derived), Rev.A_Y9, not manufactured (see status).
# No order_spec.json or mech_contract.json exists for this revision, so every
# value below with provenance comes from a script constant.

schema: therapia-pcb-harness/product/1
product:
  name: brain_canvas
  title: Therapia EEG-HRV (Cerelog-derived)
  revision: Rev.A_Y9
  repo: KL-Technologies/therapia-eeg-hrv-kicad
  board_file: board/Therapia_EEG-HRV.kicad_pcb
  status: "not manufactured: Y8 (the 2026-08-29 cart) was never paid and is withdrawn -- 106 vias in SMD openings (ACCEPTANCE I, 2026-09-23). Y9 is the corrected package. Kept as the second product in the Core equivalence proof and as a fixture (open_questions Q7, ruling E-1)."
host:
  kind: standalone
  note: No host module and therefore no M-Bus contract.
board:
  coordinate_system:
    origin: kicad_absolute
    y_axis: down
    note: Unlike m5stack this board has no contract coordinate system; it was imported from EasyEDA and the absolute KiCad grid is what every measurement refers to.
    # The drill/place origin the IPC-D-356 export was written from, in board mm.
    # This board exported from (120, 80), not KiCad's default; S8 measures every
    # d356 coordinate from it (escalation 007).
    drill_origin_mm: [120.0, 80.0]
  holes:
    copper_keepout_margin_mm: 0.2
    copper_margin_mm: 0.2
    npth:
      - [PEG2, 176.861075, -108.097861, 0.7]
      - [PEG1, 176.861075, -113.877885, 0.7]
      - [H1, 123.048, -83.048, 2.3876]
      - [H2, 176.9468, -83.048, 2.3876]
      - [H3, 123.048, -121.9608, 2.3876]
      - [H4, 176.9468, -121.9608, 2.3876]
  # --- added 2026-09-23 (harness S6/S7/S8 safety gates, Q474) ---------
  # ACCEPTANCE D: "PTH 16" (J2's 12 pins + J1's 4 shell legs), measured by
  # scripts/50_final_check.py as PTH_PADS and unchanged since S2.
  pth_pads: 16
  # The order: 1.6 mm (gates/S9.json items[0].spec, data/order_spec.json).
  thickness_mm: 1.6
  outline:
    h_mm: 45.0088
    tolerance_mm: 0.01
    w_mm: 61.8236
fab:
  vendor: jlcpcb
  # --- added 2026-09-23 (harness S7/S8 safety gates, Q474) --------------
  # The order as it stands in the cart (gates/S9.json), as a file S7 and S9
  # read. Via Covering stays Tented: the Y9 fix moved the vias out of the pads
  # rather than buying a fill (ACCEPTANCE I).
  order_spec: data/order_spec.json
  # What scripts/60_export_fab.sh writes for a human to look at. There is no
  # iso preview: 60_export_fab.sh renders top and bottom only.
  human_facing:
    - preview_top.png
    - preview_bottom.png
    - assembly_top.pdf
  # Every fitted part is on the top (ACCEPTANCE F; B.Paste is empty).
  pcba_side: Top
  # Does this design have custom design rules of its own?
  # `required`: board/Therapia_EEG-HRV.kicad_dru holds them, and a DRC run
  # without that file measures the board against KiCad's defaults, so it is
  # refused. `none`: the design declares none and DRC runs anyway. It is a
  # declaration because it cannot be looked up -- a design with no custom
  # rules and one that lost its rules file are the same directory
  # (Q120, escalation 026, ruling (b)).
  custom_rules: required
  layers: 4
  copper_layers:
    - F.Cu
    - In1.Cu
    - In2.Cu
    - B.Cu
  layer_roles:
    F.Cu: signal
    In1.Cu: ground
    In2.Cu: power
    B.Cu: signal
  via:
    in_pad_policy: forbidden
    covering: none
    # Decision, 2026-09-23 (ACCEPTANCE I): a PTH hit with a drill at most this
    # is a via, larger is a component hole. Vias here are 0.305 mm, the
    # smallest component hole is 0.6 mm. The harness's S7_viapad needs it to
    # read the drill file; scripts/67_viapad_gate.py uses the same 0.5.
    drill_max_mm: 0.5
    minimum:
      annular_mm: 0.076
      diameter_mm: 0.45
      drill_mm: 0.3
    standard:
      diameter_mm: 0.6096
      drill_mm: 0.3048
  qty_pcb: 5
  qty_pcba: 2
  clearance:
    preferred_mm: 0.127
    standard_mm: 0.0889
  copper_extensions:
    - gtl
    - g1
    - g2
    - gbl
  edge_clearance_mm: 0.2
  gerber_extension_to_layer:
    gtl: F.Cu
    g1: In1.Cu
    g2: In2.Cu
    gbl: B.Cu
    gts: F.Mask
    gbs: B.Mask
    gtp: F.Paste
    gbp: B.Paste
    gto: F.SilkS
    gbo: B.SilkS
    gm1: Edge.Cuts
  hole_to_copper_mm: 0.2
  hole_to_hole_mm: 0.2
  mask:
    min_width_mm: 0.0508
    pad_to_mask_mm: 0.0508
  paste:
    pad_to_paste_mm: 0.0
  track:
    min_mm: 0.0889
    power_mm: 0.254
    signal_mm: 0.2032
packs:
  afe-adc:
    adc_ref: U_ADS
    adc_part: ADS1299
    zero_via_nets: []
    note: Rev.A predates the per-net copper rules; C1-C4 were never written for this board.
    # --- added 2026-09-23: the twenty keys params.schema.json requires -----
    # Each transcribed from this board's contract (contract/netlist_contract.
    # json), its own scripts, or the ADS1299 datasheet as quoted in
    # docs/ads1299_layout_checklist.md and the pack checklist. Nothing guessed.
    # SBAS499 12.1 (checklist J1): no via between a VCAP/VREF bypass cap and
    # the device -- a class of nets, hence prefixes.
    no_via_in_span_prefixes: [VCAP, VREF]
    # All eight channels are wired to electrodes in the contract: R_IN<n>P
    # pin 1 is FP1/FP2/CH3/ECGP/CH5-CH8_ELEC, R_IN<n>N pin 1 is SRB1 (IN4N:
    # ECGN_ELEC). SRB1 is the common reference. No channel is dead.
    live_analog_nets: [IN1P, IN1N, IN2P, IN2N, IN3P, IN3N, IN4P, IN4N,
                       IN5P, IN5N, IN6P, IN6N, IN7P, IN7N, IN8P, IN8N, SRB1]
    diff_cap_ref_prefix: C_DIF          # C_DIF1..C_DIF8 on the board
    capacitor_ref_prefix: C_            # every capacitor designator is C_*
    series_resistor_ref_prefix: R_      # R_ + IN1P = R_IN1P
    # The prefixes of nets.power_nets below (the supply nets of this board).
    supply_prefixes: [AVDD, AVSS, DVDD, VCAP, VREF, GND, CHASSIS_GND, VNEG,
                      V_NLDO, V_PLDO, V5_LM, V_3V3, VDD_ESP, USB_5V, USB_VBUS,
                      LM_CAP]
    # scripts/47_layout_quality.py SPI (checklist J5: SCLK/DIN/DOUT/CS/DRDY)
    spi_nets: [ADS_SCLK_LOC, ADS_DIN_LOC, ADS_DOUT_LOC, ADS_CS_N, ADS_DRDY_N]
    # the one ground plane (In1.Cu GND); 47_layout_quality.py J5 probes GND
    ground_nets: [GND]
    # AVDD1 (pin 54) and AVSS1 (pin 53) sit on AVDD and AVSS in the contract:
    # there is no separate star net and no link resistor to name.
    star_links: []
    # checklist J3/J4: VCAP1 = 100 uF (DS pin table, "Connect a 100-uF
    # capacitor to AVSS"), VREFP-VREFN >= 10 uF (DS 9.3.1.3.4);
    # docs/ads1299_layout_checklist.md lines 81 and 85.
    vcap1_ref: C_VCAP1
    vcap1_min_uf: 100.0
    vrefp_cap_prefix: C_VREFP
    vrefp_bulk_min_uf: 10.0
    # checklist J4, DS 11: "EIA class 2 and class 3 dielectrics such as (X7R,
    # X5R, X8R, and so forth) are ferroelectric". Class-3 Y5V/Z5U included.
    bad_dielectric: [X5R, X7R, X8R, Y5V, Z5U]
    # checklist J6: RESV1 is pin 31, tied to GND in the contract (this board's
    # DGND is the net GND)
    resv_pin: 31
    resv_nets: [GND]
    unused_input_channels: []
    input_net_prefix: IN
    # No unused channel, so no tie jumper exists; the empty suffix is never
    # matched against anything (unused_input_channels is empty).
    unused_input_tie_suffix: ""
    out_of_scope:
      J2: "no star net: AVDD1/AVSS1 (pins 54/53) are on AVDD/AVSS in the contract, with no link resistor for a star_links triple to name"
      J7: "no unused analog input: all eight channels are wired to electrodes"
  esp32-straps:
    mcu_ref: U_MCU
    module: ESP32-WROOM-32UE
    body_mm:
      - 19.2
      - 18.0
    keepout_antenna_mm: 6.3
    strap_pins:
      IO12:
        pull: none
        why: MTDI pulled to 3V3 through 10k stops the module booting
  usb-uart:
    bridge_ref: U_USB
    bridge_part: CH340C
    lcsc: C7464026
    connector_ref: J1
    connector_kind: usb-c
  easyeda-import:
    source_export: import/
    importer_defects:
      - pad_net_loss
      - layer_name_mangling
  jlcpcb:
    cart: https://cart.jlcpcb.com/shopcart/cart
    # The panel the board is quoted on: Standard PCBA, because U_MCU was
    # "Standard Only" at JLC (STATUS.md; gates/S9.json items[1].kind).
    # Added 2026-09-23 for the harness S7/S8 safety gates.
    pcba_type_required: Standard PCBA
    # --- added 2026-09-05, escalation 025 (a) -------------------------
    # The six keys packs/jlcpcb's schema requires and this manifest did not
    # state. S0_manifest now validates every enabled pack against
    # packs/<name>/params.schema.json (open question Q12) and named the gap.
    # TRANSCRIBED, not decided. bom_csv / cpl_csv are the file names
    # scripts/61_make_bom_cpl.py writes (lines 162 and 187) and which are in
    # fab/. bom_columns / cpl_columns are that script's BOM_COLUMNS and
    # CPL_COLUMNS (lines 51 and 53). rules and rule_severities are
    # scripts/14_make_rules.py's own constants (CLEARANCE_MM, TRACK_MIN_MM,
    # ... and SEVERITY_ERROR / SEVERITY_WARNING / SEVERITY_IGNORE), which
    # that script writes into board/Therapia_EEG-HRV.kicad_pro. Not one
    # number here is new: ACCEPTANCE.md sections A and C remain the
    # authority and this is the machine-readable copy the packs read.
    bom_csv: BOM_JLCPCB.csv
    cpl_csv: CPL_JLCPCB.csv
    bom_columns:
      - Comment
      - Designator
      - Footprint
      - "LCSC Part #"
      - MPN
      - Manufacturer
      - Qty
    cpl_columns:
      - Designator
      - Mid X
      - Mid Y
      - Layer
      - Rotation
    rules:
      min_clearance_mm: 0.0889
      min_track_width_mm: 0.0889
      min_hole_to_hole_mm: 0.2
      min_hole_clearance_mm: 0.2
      min_copper_edge_clearance_mm: 0.2
      min_through_hole_diameter_mm: 0.3
      min_via_annular_width_mm: 0.076
      min_via_diameter_mm: 0.45
      track_track_preferred_mm: 0.127
      via_diameter_mm: 0.6096
      via_drill_mm: 0.3048
      track_signal_mm: 0.2032
      track_power_mm: 0.254
      pad_to_mask_mm: 0.0508
      pad_to_paste_mm: 0.0
      solder_mask_min_width_mm: 0.0508
    rule_severities:
      error:
        - annular_width
        - clearance
        - connection_width
        - copper_edge_clearance
        - creepage
        - diff_pair_gap_out_of_range
        - diff_pair_uncoupled_length_too_long
        - drill_out_of_range
        - footprint
        - footprint_symbol_mismatch
        - hole_clearance
        - hole_near_hole
        - hole_to_hole
        - invalid_outline
        - item_on_disabled_layer
        - items_not_allowed
        - length_out_of_range
        - malformed_courtyard
        - microvia_drill_out_of_range
        - padstack
        - shorting_items
        - skew_out_of_range
        - solder_mask_bridge
        - text_height
        - text_thickness
        - through_hole_pad_without_hole
        - too_many_vias
        - track_angle
        - track_segment_length
        - track_width
        - tracks_crossing
        - unconnected_items
        - unresolved_variable
        - zone_has_empty_net
        - zones_intersect
      warning:
        - courtyards_overlap
        - silk_overlap
        - silk_over_copper
        - silk_edge_clearance
        - starved_thermal
        - track_dangling
        - via_dangling
        - isolated_copper
        - copper_sliver
        - holes_co_located
        - footprint_type_mismatch
      ignore:
        - lib_footprint_issues
        - lib_footprint_mismatch
        - missing_courtyard
        - pth_inside_courtyard
        - npth_inside_courtyard
        - footprint_filters_mismatch
paths:
  contract: contract/netlist_contract.json
  contract_overrides: contract/contract_overrides.json
  parts_table: data/parts_lcsc.csv
  cpl_overrides: data/cpl_overrides.json
  body_overlap_allow: data/body_overlap_allow.json
  gates: gates
  fab_out: fab
  logs: logs
  # Added 2026-09-23 (harness S7/S8): the DNP list and the mechanical
  # declaration (notch) as the files the harness reads.
  dnp: data/dnp.json
  mech_contract: contract/mech_contract.json
acceptance:
  document: ACCEPTANCE.md
  clauses:
    generic:
      - A
      - B
      - E
      - F
      - G
      - H
    product:
      - D
    from_pack:
      jlcpcb:
        - C
      easyeda-import: []
nets:
  # Pads the contract marks NC (netlist_contract.json by_designator, net "NC").
  # KiCad carries them with no net; they are declared so S7_clearance's K-5 row
  # knows the copper is owned (harness Q478). Measured 2026-09-23 on Y9: 34
  # pads, 34 of them NC in the contract, contract_parity 0 and 0
  # shorting_items on the board.
  netless_copper: [J1.3, J1.9, TLV70025.4,
                   U_ADS.27, U_ADS.29, U_ADS.37, U_ADS.60, U_ADS.62, U_ADS.64,
                   U_MCU.4, U_MCU.5, U_MCU.6, U_MCU.7, U_MCU.8, U_MCU.9,
                   U_MCU.10, U_MCU.11, U_MCU.17, U_MCU.18, U_MCU.19, U_MCU.20,
                   U_MCU.21, U_MCU.22, U_MCU.26, U_MCU.27, U_MCU.32, U_MCU.33,
                   U_MCU.36,
                   U_USB.7, U_USB.8, U_USB.9, U_USB.10, U_USB.11, U_USB.12]
  plane_nets:
    - GND
    - AGND
    - DGND
    - 3V3
    - 5V
    - VNEG5
  routing_order:
    - analog_in
    - bypass
    - power
    - digital
    - other
  power_nets:
    - GND
    - CHASSIS_GND
    - AVDD
    - AVSS
    - DVDD
    - VDD_ESP
    - USB_5V
    - USB_VBUS_RAW
    - V5_LM_IN
    - V_3V3_IN
    - V_NLDO_IN
    - V_PLDO_IN
    - VNEG5
    - VREFP
    - VCAP1
    - VCAP2
    - VCAP3
    - VCAP4
    - LM_CAP_N
    - LM_CAP_P
tools:
  kicad: 10.0.5
  kicad_python_env:
    PYTHONNOUSERSITE: "1"
gates:
  # --- added 2026-09-23 (harness S7/S8 safety gates, Q474) --------------
  # Transcribed from ACCEPTANCE.md and scripts/50_final_check.py, not decided.
  S7:
    # ACCEPTANCE C's table (the .kicad_pro values scripts/14_make_rules.py writes)
    rules_mm:
      min_clearance: 0.0889
      min_track_width: 0.0889
      min_hole_to_hole: 0.2
      min_hole_clearance: 0.2
      min_copper_edge_clearance: 0.2
      min_through_hole_diameter: 0.3
      min_via_annular_width: 0.076
      min_via_diameter: 0.45
    pad_to_mask_mm: 0.0508
    pad_to_paste_mm: 0.0
    # ACCEPTANCE C makes the 5 mil track-to-track recommendation a warning
    # (the .kicad_dru rule track_to_track_5mil_preferred); the 0.0889 mm rule
    # stays an error. 50_final_check.py ALLOWED_WARNINGS carries the same.
    allowed_warning_extra:
      - clearance
    # The harness's own H/J/K gates, run on Y9 at harness commit 093191b and
    # kept under their own names: gates/S7_body.json and gates/S7_viapad.json
    # are this repo's ACCEPTANCE H and I gates and are not overwritten.
    subgates:
      - {gate: harness_S7_body, title: H part bodies keep their gap, row: plain}
      - {gate: harness_S7_viapad, title: J no via opens inside an SMD pad, row: plain}
      - {gate: harness_S7_clearance, title: K copper-to-copper clearance, row: plain}
    rules_generator: scripts/14_make_rules.py
    rules_generator_inputs:
      - board
      - contract
      - logs
      - data
  S8:
    # ACCEPTANCE B/F: 135 parts on the contract, R_IO15_DN and R_RST_UP DNP,
    # 133 fitted (the BOM's 133 parts / 31 rows), no test points.
    contract_parts: 135
    dnp_parts: 2
    fitted_parts: 133
    bom_excluded_test_points: 0
  S3_rules:
    known_defects:
      - [L1, mounting hole H4 through the AMS1117 GND pad, [hole_clearance], [NPTH pad of H4, of AMS1117]]
      - [L2, CHASSIS_GND bottom track through mounting hole H1, [hole_clearance], [NPTH pad of H1, "[CHASSIS_GND]"]]
      - [L3, ESP_TXD bottom track clipping mounting hole H4, [hole_clearance], [NPTH pad of H4, "[ESP_TXD]"]]
      - [L4a, USB_VBUS_RAW routing inside a USB-C peg hole, [hole_clearance], [NPTH pad of PEG, "[USB_VBUS_RAW]"]]
      - [L4b, a via drill overlapping a USB-C peg drill, [hole_to_hole], [NPTH pad of PEG, "Via [USB_VBUS_RAW]"]]
  S7_body:
    gap_mm: 0.15
provenance:
  board.coordinate_system.drill_origin_mm:
    file: scripts/lib/ipcd356.py
    where: scripts/lib/ipcd356.py:ORIGIN_MM
    name: ORIGIN_MM
    why: "the drill/place origin every IPC-D-356 coordinate is relative to"
  board.holes.copper_margin_mm:
    file: scripts/62_check_fab.py
    where: scripts/62_check_fab.py:HOLE_MARGIN
    name: HOLE_MARGIN
  board.holes.npth:
    file: scripts/62_check_fab.py
    where: scripts/62_check_fab.py:NPTH
    name: NPTH
    why: "ACCEPTANCE D. Gerber coordinates: the KiCad frame with Y negated"
  board.outline.h_mm:
    file: scripts/62_check_fab.py
    where: "scripts/62_check_fab.py:OUTLINE_MM[1]"
    name: OUTLINE_MM
    index: 1
  board.outline.tolerance_mm:
    file: scripts/62_check_fab.py
    where: scripts/62_check_fab.py:OUTLINE_TOL
    name: OUTLINE_TOL
  board.outline.w_mm:
    file: scripts/62_check_fab.py
    where: "scripts/62_check_fab.py:OUTLINE_MM[0]"
    name: OUTLINE_MM
    index: 0
    why: "ACCEPTANCE E, measured back out of the Gerber"
  fab.custom_rules:
    source: none
    where: board/Therapia_EEG-HRV.kicad_dru -- 3 custom rules (npth_hole_to_copper, track_to_track_5mil_preferred, via_annular_ring)
    why: "measured - the file is beside the board and every DRC run in this repo is measured against it. The declaration is what lets core.repair.run_drc tell `this design has no custom rules` from `this design lost its custom rules`, which are the same directory from outside (Q120, escalation 026)."
  fab.clearance.preferred_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:TRACK_TRACK_PREFERRED_MM
    name: TRACK_TRACK_PREFERRED_MM
  fab.clearance.standard_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:CLEARANCE_MM
    name: CLEARANCE_MM
    why: "3.5 mil, the JLC minimum this board was quoted at"
  fab.copper_extensions:
    file: scripts/62_check_fab.py
    where: scripts/62_check_fab.py:COPPER
    name: COPPER
  fab.edge_clearance_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:EDGE_CLEARANCE_MM
    name: EDGE_CLEARANCE_MM
  fab.gerber_extension_to_layer:
    file: scripts/62_check_fab.py
    where: scripts/62_check_fab.py:EXPECTED
    name: EXPECTED
    why: "ACCEPTANCE E's file set: which extension is which layer"
  fab.hole_to_copper_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:HOLE_CLEARANCE_MM
    name: HOLE_CLEARANCE_MM
  fab.hole_to_hole_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:HOLE_TO_HOLE_MM
    name: HOLE_TO_HOLE_MM
  fab.mask.min_width_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:SOLDER_MASK_MIN_WIDTH_MM
    name: SOLDER_MASK_MIN_WIDTH_MM
  fab.mask.pad_to_mask_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:PAD_TO_MASK_MM
    name: PAD_TO_MASK_MM
  fab.paste.pad_to_paste_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:PAD_TO_PASTE_MM
    name: PAD_TO_PASTE_MM
  fab.track.min_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:TRACK_MIN_MM
    name: TRACK_MIN_MM
  fab.track.power_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:TRACK_POWER_MM
    name: TRACK_POWER_MM
  fab.track.signal_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:TRACK_SIGNAL_MM
    name: TRACK_SIGNAL_MM
  fab.via.minimum.annular_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:VIA_ANNULAR_MIN_MM
    name: VIA_ANNULAR_MIN_MM
  fab.via.minimum.diameter_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:VIA_DIA_MIN_MM
    name: VIA_DIA_MIN_MM
  fab.via.minimum.drill_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:VIA_DRILL_MIN_MM
    name: VIA_DRILL_MIN_MM
  fab.via.standard.diameter_mm:
    file: scripts/14_make_rules.py
    where: scripts/14_make_rules.py:VIA_DIA_MM
    name: VIA_DIA_MM
